name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 产物大小预算（业务主包 gzip < 900KB）
        run: node scripts/check-budget.mjs

      # E2E（M4.4）暂不入 CI：需要 WebGL 环境与 Chromium 下载，本地/发版前执行
      # pnpm exec playwright install chromium && pnpm test:e2e
